# 워커 신원. 이름 고정 + entrypoint가 숫자만 PUID/PGID로 갈아끼운다. getpwnam 항상 성공.
user webdav webdav;
load_module modules/ngx_http_js_module.so;

worker_processes auto;
events { worker_connections 1024; }

http {
  # 0. 기본 MIME + 문자셋/해시
  include /usr/local/nginx/conf/mime.types;
  charset utf-8;
  types_hash_max_size 8192;
  types_hash_bucket_size 128;

  # 1. 코드 확장자 -> text/plain (브라우저에서 바로 열기)
  # 출처: mime-db(text/*) + github-linguist(programming/markup/prose)에서 nginx 기본값과 겹치는 것 제외
  types {
    text/plain 1in 1m 1x 3in 3m 3p 3pm 3qt 3x 4dm 4gl 4th 6pl 6pm 8xp a51 abap ada adb ado adoc adp
                 ads agc agda ah1 ah2 ahk ahkl aidl aj ak al aleo alg als ampl apex apib apl app
                 arc arr as asax asc ascx asd asddls ash ashx asl asm asmx asp aspx astro asy au3
                 aug auk aux aw awk axd axi axs b bal baml bas bash bashrc bat bats bb bbcode bbx
                 bdy be bf bi bib bibtex bicep bison blade blp bmx bones boo boot bpl bqn bro brs
                 bru bs bsl bst bsv bzl c c++ c3 cairo cake capnp carbon cats cbl cbx cc ccp cdc
                 cdf cds ceylon cfc cfm cfml cgi cginc ch chem chpl chs circom cirru cj cjs cjsx ck
                 cl cl2 clar click clj cljc cljs cljscm cljx clp cls clue clw cmake cmd cnc cob
                 cobol cocci coffee com cook coq cp cpp cppm cps cpy cql cr creole cs csc csd csh
                 cshrc cshtml csv csx ctl ctp cts cu cue cuh curry cw cwl cxx cy cyp cypher d d2 dart
                 das dats db2 dcl ddl decls dfm dfy dhall di diz djs dlm dm do doh dpr druby dsc dsl
                 dsp dsr dtx duby dwl dyalog dyl dylan e ebuild ec ecl eclass eclxml ecr ect edge
                 edgeql eh ejs el eliom eliomi elm elv em emacs envrc epsi eq erb erl es es6 esdl
                 ets ex exrc exs eye f f03 f08 f77 f90 f95 factor fan fcgi fir fish flex flix flux
                 fnc fnl for forth fp fpp fppi fr frag frg frm frt fs fsh fsi fst fsti fsx fth ftl
                 ftlh fun fut fx fxh fy g g4 gaml gap gawk gco gcode gd gdb geo geom gf gi gjs
                 gleam glf glsl glslf glslv gmi gml gms gno gnu gnus go god gohtml golo gotmpl gp
                 grace groovy grt gs gsc gsh gsp gst gsx gtpl gts gvimrc gvy gyp gypi h h++ ha hack
                 haml hats hb hbs hc hcl heex hexpat hh hhi hic hip hlean hlsl hlsli hoon hpp hqf
                 hql hrl hs hsc hta hurl hx hxsl hxx hy i i3 i7x ice iced icl idc idr ig ihlp ijm
                 ijs ik il ily imba inc ink inl ino ins intr io iol ipf ipp ipynb irbrc isl ispc
                 iss ixx j j2 jac jade jai jake janet jav java jcl jflex jinja jinja2 jison jl jq
                  jsb jscad jsfl jsh jslib jsm jsp jspre jss jst jsx jte just k kak kid kit kk
                 kojo krl ks ksh kshrc ksy kt ktm kts kv l lagda las lasso lasso8 lasso9 latte lbx
                 ld lds lean leex leo less lex lfe lgt lhs lid lidr ligo linq liq liquid lisp
                 livemd lkml ll lmi log login lol lookml lp lpr ls lsl lslp lsp ltx lua luau lvlib
                 lvproj ly m m2 m3 m4 ma mak make mako man mao marko mask mata matah matlab mawk
                 maxpat mbt mc mch mcr md mdoc mdown mdwn mdx me metal metta mg minid mint mirah
                 mjs mk mkd mkdn mkdown mkfile mkii mkiv mkvi ml ml4 mli mligo mlir mll mly mm mmd
                 mmk mms mo mod mojo monkey moo moon move mpl mps mq4 mq5 mqh mrc ms msd msg mspec
                 mss mt mtml mts mu mud muf mumps muse mxt myt mzn n nas nasl nasm nawk nb nbp nc
                 ncl ne ned nf nfo ni nim nimble nimrod nims nit nix njk njs nl nlogo no nomad nqp nr
                 nse nsh nsi nss nu numpy numpyw numsc nut nvimrc ny ob2 odin ol ooc opa opal
                 opencl opy orc org os ox oxh oxo oz p p4 p6 p6l p6m p8 pac pact pan parrot pas
                 pascal pasm pat pb pbi pbt pc pck pcss pddl pde peggy pegjs pep per perl pfa pgsql
                 ph php php3 php4 php5 phps phpt phtml pic pig pike pir pkb pkl pks pl6 plb plot
                 pls plsql plt plx pm6 pml pmod po pod pod6 podsl pogo polar pony por pot pov pp
                 pprx pq praat prawn prg pri pro prolog prw pryrc ps1 psc psd1 psgi psm1 pug purs
                 pwn pxd pxi py py3 pyde pyi pyp pyt pyw pyx q qasm qbs qc ql qll qmd qml qnt qs r
                 r2 r3 rabl rake raku raml razor rb rbbas rbfrm rbi rbmnu rbres rbtbar rbuild rbw
                 rbx rbxs rchit rd rdoc re reb rebol red reds rego rei religo res resi rest rex
                 rexx rg rhai rhtml ring riot rkt rktd rktl rl rmd rmiss rnh rno rnw robot roc roff
                 ronn rpgle rpy rs rsc rsh rst rsx ru ruby s sage sagews sail sas sass sats sbatch
                 sbt sc scad scala scaml scd sce scenic sch sci scm sco scpt scrbl scss sdc sed
                 self sexp sh shader shen sieve sig sip sj sjs sl slang sld slim slint sls slurm
                 sma smali smithy smk sml smt smt2 snip sol soy sp spc spec spin sps sqf sql sra
                 srt sru srw ss ssjs sss st stan star sthlp story sty styl surql sv svelte svh svx
                 sw swg swift swig t tac tact tag talon tape tcc tcsh td tea templ tesc tese tex
                 texi text tf tftpl tfvars thor thrift thy tl tla tlv tm tmac tmpl tmux toc tofu toit
                 tolk tool tpb tpl tpp tps trg tsp tst tsv tsx tu twig txi txl txx typ uc udo uno upc
                 uplc ur urs v vala vapi vark vb vba vbhtml vbs vcl veo verse vert vh vhd vhdl vhf
                 vhi vho vhs vht vhw vim vimrc viper vmb volt vrx vs vsh vtl vto vue vw vy w wast
                 wat watchr wdl webidl wgsl whiley wiki wisp wl wlk wls wlt wlua wren ws wsgi x x10
                 x68 xc xdc xht xi xm xpl xproc xpy xq xql xqm xquery xqy xrl xs xsh xsjs xsl xslt
                 xtend xzap y yacc yaml yap yar yara yml yrl yul yy z3 zap zeek zep zig zil zimpl zlogin
                 zmpl zpl zs zsh zshenv zshrc;
  }

  # 1b. stock mime.types에 빠진 바이너리. 빠지면 default text/plain으로 새서 pre가 죽는다(실측: .tar).
  types {
    application/x-tar tar tgz tbz txz;
    application/gzip gz;
    application/x-bzip2 bz2;
    application/x-xz xz;
    application/zstd zst;
    application/vnd.android.package-archive apk;
  }

  # 2. njs: 폴더 다운로드 목록 생성 (in-process)
  js_import ziplist from /usr/local/nginx/njs/zip-list.js;

  # 2b. njs: brute-force 가드 (in-process, slab 공유)
  js_import guard from /usr/local/nginx/njs/guard.js;
  # evict는 timeout= 필수라 뺀다. 키가 IP라 단일 공격자가 채울 수 없고, 분산 채움은 이 위협 모델 밖이다.
  js_shared_dict_zone zone=watch:1M type=number;
  js_shared_dict_zone zone=ban:256k timeout=1d evict;
  js_set $guard_banned guard.is_banned;
  js_var $guard_max 5;

  # 2c. L7 프록시(192.168.9.122 -> 192.168.9.120:10201) 뒤 진짜 클라이언트 IP 복원.
  # 프록시는 X-Forwarded-For=$proxy_add_x_forwarded_for 전송 중. 프록시 수정 불필요.
  # guard.js key(r)=r.remoteAddress가 복원된 값을 그대로 쓴다.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 192.168.9.122/32;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # 3. 대용량 PUT 허용 (개인 서버 전제)
  client_max_body_size 0;
  # 서버는 순수 DAV로 둔다. 1단↓ 판단은 클라이언트 몫. / 삭제 하나만 아래 ~ /$에서 막는다.

  server {
    listen 80;
    root /data;
    # 도커 포트매핑/프록시 뒤에서 리다이렉트가 엉뚱한 곳을 가리키지 않게.
    # /docs -> /docs/ 301이 :10201을 잃는 버그(실측) 수정.
    port_in_redirect off;
    absolute_redirect off;

    # 403에선 브라우저가 로그인 창을 띄우지 않는다. 상태는 속이지 않고(403 유지),
    # 페이지 안에 로그인 길을 둔다. 버튼은 더미 계정 트릭으로 캐시를 비우고 / 로 보내 401 창을 띄운다.
    error_page 403 /__403;
    # 401은 카운터로: 틀린 비번만 셈(핸드셰이크 제외). 5연속→1d 차단.
    error_page 401 /_failcount;
    # 차단된 IP는 auth 전에 연결 종료. /_failcount는 gate 제외(is_banned 내 r.uri 검사).
    if ($guard_banned) { return 444; }
    location = /__403 {
      internal;
      auth_basic off;
      default_type text/html;
      return 403 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>접근 거부</title></head><body style="font-family:system-ui;text-align:center;padding:40px"><h1>접근이 거부되었습니다 (403)</h1><p>계정 권한이 없거나 허용되지 않은 경로입니다.</p><p><button onclick="location.href=location.protocol+&#39;//logout:logout@&#39;+location.host+&#39;/&#39;">로그인 / 계정 전환</button> <a href="/">목록으로</a></p></body></html>';
    }

    # 매칭 우선순위: exact(=) > prefix > regex > internal. 아래도 그 순서다.
    # 1) 폴더 다운로드 (exact)
    location = /_zip/download {
      auth_basic "WebDAV";
      auth_basic_user_file /usr/local/nginx/conf/.htpasswd;
      js_content ziplist.download;
      js_header_filter guard.observe;
    }

    # 조립용 내부 홉. mod_zip은 upstream 응답의 헤더에서만 발동하므로
    # njs 직접 응답이 아니라 temp 목록 파일 + proxy를 태운다.
    location = /_zipasm {
      internal;
      auth_basic "WebDAV";
      auth_basic_user_file /usr/local/nginx/conf/.htpasswd;
      proxy_pass http://127.0.0.1:80/_ziplistfile;
      proxy_set_header Accept-Encoding "";
      js_header_filter guard.observe;
    }
    location = /_ziplistfile {
      # proxy가 새 커넥션으로 오므로 internal 불가. 루프백만 허용.
      allow 127.0.0.1;
      deny all;
      js_content ziplist.listfile;
      add_header X-Archive-Files zip;
      js_header_filter guard.observe;
    }

    # 401 카운터. internal이라 외부 직접 접근 불가.
    location = /_failcount {
      internal;
      js_content guard.count;
    }

    # 2) 파일 (prefix). 디렉토리(/로 끝남)는 3에서 처리한다.
    # add_after_body를 여기에 두지 않는 이유: .html 같은 파일 다운로드 본문이 오염되기 때문.
    # nginx 기본 default_type=text/plain이라 안 덮으면 매핑 빠진 바이너리가 text로 샌다(실측 .tar/.zzz).
    # unknown은 octet(다운로드)으로. extless 의도 텍스트(README 등)는 아래 regex가 text/plain 유지.
    location / {
      default_type application/octet-stream;
      auth_basic "WebDAV";
      auth_basic_user_file /usr/local/nginx/conf/.htpasswd;
      dav_methods PUT DELETE MKCOL COPY MOVE;
      dav_ext_methods PROPFIND OPTIONS;
      create_full_put_path on;
      dav_access user:rw group:rw all:r;
      # 성공 응답이면 watch에서 강등.
      js_header_filter guard.observe;
    }

    # 3) 디렉토리 목록 (regex, /로 끝남). autoindex HTML에만 UI를 얹는다.
    location ~ /$ {
      # / 삭제만 막는다. 딱 이것만 서버가 막고, 1단↓는 순수 DAV(조심은 브라우저 confirm 몫).
      # DELETE / 는 정규(~ /$)가 prefix를 이겨서 여기로 온다.
      # 초기값은 빈 문자열. 0으로 두면 0DR이 돼서 = DR 비교가 평생 실패한다(실측 DELETE / 403).
      set $deny_root '';
      if ($request_method = DELETE) { set $deny_root "${deny_root}D"; }
      if ($uri = /) { set $deny_root "${deny_root}R"; }
      if ($deny_root = DR) { return 409; }
      auth_basic "WebDAV";
      auth_basic_user_file /usr/local/nginx/conf/.htpasswd;
      dav_methods PUT DELETE MKCOL COPY MOVE;
      dav_ext_methods PROPFIND OPTIONS;
      create_full_put_path on;
      dav_access user:rw group:rw all:r;
      autoindex on;
      autoindex_exact_size off;
      # preload 준비 요청. shell이 body 끝이라 HTML 링크보다 헤더가 먼저 발견된다.
      add_header Link "</_ui/ui.css>; rel=preload; as=style, </_ui/ui.js>; rel=preload; as=script, </_ui/highlight.min.js>; rel=preload; as=script";
      add_after_body /_ui/shell.html;
      js_header_filter guard.observe;
    }

    # 3) 확장자 없는 파일명 -> text/plain (regex, DAV 동작은 2와 동일)
    # "README/" 같은 디렉토리는 위 3(~/$)이 먼저 잡는다. 파일에만 걸린다.
    # 출처: github-linguist filenames(도트파일) + 대표 파일명 147개
    location ~/(?:\.abbrev_defs|\.ackrc|\.agignore|\.all\-contributorsrc|\.arcconfig|\.atomignore|\.auto\-changelog|\.babelignore|\.babelrc|\.bash_aliases|\.bash_functions|\.bash_history|\.bash_logout|\.bash_profile|\.bashrc|\.browserslistrc|\.buckconfig|\.bzrignore|\.c8rc|\.ckignore|\.clang\-format|\.clang\-tidy|\.clangd|\.classpath|\.coffeelintignore|\.coveragerc|\.cproject|\.cshrc|\.curlrc|\.cvsignore|\.dir_colors|\.dircolors|\.dockerignore|\.easignore|\.editorconfig|\.eleventyignore|\.emacs|\.env|\.envrc|\.eslint\-ignore|\.eslintignore|\.eslintrc|\.exrc|\.factor\-boot\-rc|\.factor\-rc|\.flake8|\.flaskenv|\.gclient|\.gemrc|\.git\-blame\-ignore\-revs|\.gitattributes|\.gitconfig|\.gitmessage|\.gitmodules|\.gitreview|\.gn|\.gnus|\.gvimrc|\.htaccess|\.htmlhintrc|\.ignore|\.imgbotconfig|\.inputrc|\.irbrc|\.jscsrc|\.jshintrc|\.jslintrc|\.Justfile|\.justfile|\.JUSTFILE|\.kshrc|\.latexmkrc|\.login|\.luacheckrc|\.markdownlintignore|\.nanorc|\.nodemonignore|\.npmignore|\.npmrc|\.nvimrc|\.nycrc|\.php_cs|\.prettierignore|\.profile|\.project|\.pryrc|\.pylintrc|\.releaserc|\.rgignore|\.Rhistory|\.Rprofile|\.rspec|\.shellcheckrc|\.simplecov|\.spacemacs|\.stylelintignore|\.swcrc|\.tern\-config|\.tern\-project|\.tgitconfig|\.tm_properties|\.vercelignore|\.vimrc|\.viper|\.vscodeignore|\.watchmanconfig|\.wgetrc|\.XCompose|\.xinitrc|\.xsession|\.yardopts|\.zlogin|\.zlogout|\.zprofile|\.zshenv|\.zshrc|AUTHORS|Brewfile|CHANGELOG|CHANGES|CODEOWNERS|Containerfile|CONTRIBUTING|COPYING|Dockerfile|dockerfile|Dockerfile\.dev|Dockerfile\.prod|Earthfile|Gemfile|GNUmakefile|INSTALL|Justfile|LICENCE|LICENSE|Makefile|Makefile\.am|NEWS|NOTICE|PATENTS|Procfile|Rakefile|README|Tiltfile|TODO|Vagrantfile|VERSION)$ {
      auth_basic "WebDAV";
      auth_basic_user_file /usr/local/nginx/conf/.htpasswd;
      dav_methods PUT DELETE MKCOL COPY MOVE;
      dav_ext_methods PROPFIND OPTIONS;
      create_full_put_path on;
      dav_access user:rw group:rw all:r;
      autoindex on;
      autoindex_exact_size off;
      default_type text/plain;
      js_header_filter guard.observe;
    }

    # 4) 브라우저 UI 정적 파일 (prefix). DAV 제외, no-cache.
    # auth를 끄는 이유: 데이터가 없는 CSS/JS라 공개해도 되고,
    # add_after_body subrequest가 인증 없이 통과해야 해서.
    location ^~ /_ui/ {
      auth_basic off;
      alias /usr/share/webdav-ui/;
      autoindex off;
      # 1분 캐시. 갱신 후 최대 1분 지연을 감수한다.
      add_header Cache-Control "max-age=60";
    }

    # 4-2) 브라우저 자동 요청. 인증 없이 (로그인 전 탭에도 떠야 해서).
    location = /favicon.ico {
      auth_basic off;
      alias /usr/share/webdav-ui/favicon.ico;
      add_header Cache-Control "max-age=86400";
    }
    location = /apple-touch-icon.png {
      auth_basic off;
      alias /usr/share/webdav-ui/apple-touch-icon.png;
      add_header Cache-Control "max-age=86400";
    }

    # 5) mod_zip subrequest 전용. internal이라 외부 직접 접근 불가, 인증 불필요.
    # ^~ 필수: 확장자 없는 파일(Dockerfile 등)이 extless regex에 낚이지 않게 regex 평가를 막는다.
    location ^~ /_zipfile/ {
      internal;
      alias /data/;
    }
  }
}
